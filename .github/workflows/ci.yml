name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    env:
      # TesterArmy e2e: no telemetry and no update check.
      E2E_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The bun version is the `packageManager` field in package.json.
          bun-version-file: package.json
      # The e2e CLI runs on Node (^22.22.3 or >=24.8), not on Bun's runtime.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # Checks every Topic file and regenerates the topic index. A broken
      # Topic file fails here, naming the file and the Question.
      - run: bun run check-content
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      # The test build on the fixture Topic set, into dist-fixtures/. It
      # checks the fixtures and regenerates their topic index first.
      - run: bun run build:fixtures
      # The real build is what deploys, so none of the test build's switches
      # may be in it: the instant-reveal key, the sound readout and the
      # stand-in analytics token and script. Each is behind a mode check that
      # the real build folds away; this fails if one stops folding, or if a
      # switch is renamed and the test build no longer has it.
      - run: bun run check-real-build
      - name: Committed files are up to date after build (src/routeTree.gen.ts, src/content/topic-index.gen.json, src/content/topic-index.fixtures.gen.json)
        run: git diff --exit-code
      # The Chromium build that @e2e-dev/web's Playwright expects, with its
      # Linux libraries.
      - name: Install Chromium for e2e
        run: bunx @e2e-dev/web install chromium --with-deps
      # The journeys in tests/*.e2e.ts, with exact steps only (no model or
      # API key), in Chromium against the fixture build in dist-fixtures/.
      - name: e2e journeys
        run: bun run e2e
      - name: Upload the e2e report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: .e2e/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      # The deploy job ships this exact build rather than building again: the
      # real build in dist/, on the real Topics. The fixture build in
      # dist-fixtures/ is only for the e2e journeys above and never deploys.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy
    needs: checks
    # Only pushes to main deploy. Pull requests never do.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Installs the wrangler locked in bun.lock; wrangler-action uses it.
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: deploy
