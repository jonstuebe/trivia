<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The Studio logo disc (Visual direction, direction A): the Main menu's
    .logo in src/ui/studio.css, drawn square so it can also be the app icon.
    The word is set in Cinzel 800, which the render script loads from
    @fontsource/cinzel; see scripts/render-link-preview.ts.
  -->
  <defs>
    <radialGradient id="disc" gradientUnits="userSpaceOnUse" cx="256" cy="185" r="271">
      <stop offset="0" stop-color="#3a46ff" />
      <stop offset="1" stop-color="#0b0e3a" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>
  <circle cx="256" cy="256" r="240" fill="#5b6cff" fill-opacity="0.6" filter="url(#glow)" />
  <circle cx="256" cy="256" r="229" fill="url(#disc)" stroke="#f5c542" stroke-width="14" />
  <text
    x="256"
    y="256"
    dx="6"
    dy="0.35em"
    text-anchor="middle"
    fill="#eef1ff"
    font-family="Cinzel, Georgia, serif"
    font-weight="800"
    font-size="96"
    letter-spacing="0.12em"
  >TRIVIA</text>
</svg>
